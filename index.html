<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Foot Penalty V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}.app{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(#0b4024,#062516);padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900}.pill{background:#ffffff18;border:1px solid #ffffff22;padding:7px 10px;border-radius:999px}.card{background:#0b2e1d;border:1px solid #ffffff18;border-radius:18px;padding:16px;margin-top:14px}.q{font-size:20px;font-weight:800;margin:8px 0 14px}.answers{display:grid;gap:9px}.ans{background:#123d28;color:#fff;border:1px solid #ffffff20;border-radius:12px;padding:13px;text-align:left;font-weight:700}.ans:active{transform:scale(.98)}.hidden{display:none!important}.field{position:relative;height:310px;margin-top:10px;border-radius:18px;overflow:hidden;background:linear-gradient(#183b7a 0 37%,#4b9b45 37%)}.lights{position:absolute;inset:0;background:radial-gradient(circle at 15% 12%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 80% 8%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 50% 16%,#fff5 0 2px,transparent 3px);opacity:.8}.crowd{position:absolute;top:28%;left:0;right:0;height:45px;background:repeating-linear-gradient(90deg,#182b45 0 12px,#243c5c 12px 24px)}.goal{position:absolute;left:7%;right:7%;top:20%;height:55%;border:6px solid #eee;border-bottom-width:8px;background:repeating-linear-gradient(90deg,#ffffff20 0 2px,transparent 2px 22px),repeating-linear-gradient(0deg,#ffffff20 0 2px,transparent 2px 22px)}.net{position:absolute;inset:0;background:linear-gradient(25deg,transparent 49%,#ffffff28 50%,transparent 51%),linear-gradient(-25deg,transparent 49%,#ffffff28 50%,transparent 51%);background-size:38px 28px}.keeper{position:absolute;left:50%;top:45%;font-size:70px;transform:translate(-50%,-50%);transition:all .45s cubic-bezier(.2,.8,.2,1);z-index:4;filter:drop-shadow(0 4px 2px #0007)}.player{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:82px;z-index:5}.ball{position:absolute;bottom:55px;left:50%;font-size:29px;transform:translateX(-50%);z-index:6;transition:all .55s cubic-bezier(.15,.8,.2,1)}.zones{position:absolute;inset:22% 9% 22%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);z-index:8}.zone{border:1px solid transparent;background:#ffffff04;border-radius:10px}.zone:active{background:#ffffff18}.msg{text-align:center;font-weight:900;min-height:28px;margin-top:10px}.mainbtn{width:100%;border:0;border-radius:13px;padding:13px;font-weight:900;background:#23d05c;color:#05210f;margin-top:10px}.shake{animation:shake .35s}.goalfx{animation:goal 0.6s}.keeper-save{animation:save .5s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes goal{50%{transform:scale(1.25)}}@keyframes save{50%{filter:drop-shadow(0 0 12px #5cf)}}.bar{height:8px;background:#ffffff16;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#35dc69;width:0;transition:width .3s}.small{font-size:13px;opacity:.72}.final{text-align:center;font-size:22px;font-weight:900;padding:20px}
</style></head><body><main class="app"><div class="top"><div class="logo">⚽ QUIZ FOOT</div><div class="pill">🔥 <span id="score">0</span></div></div><div class="small" style="margin-top:6px">PENALTY • V2 prototype</div><div class="card" id="quiz"><div class="small">Question <span id="qn">1</span>/5</div><div class="bar"><i id="prog"></i></div><div class="q" id="question"></div><div class="answers" id="answers"></div></div><div class="card hidden" id="penalty"><div class="q" style="text-align:center">🎯 Choisis où tirer</div><div class="field" id="field"><div class="lights"></div><div class="crowd"></div><div class="goal"><div class="net"></div></div><div class="keeper" id="keeper">🧤</div><div class="ball" id="ball">⚽</div><div class="player">🧑🏽‍🦱</div><div class="zones">${'<button class="zone" data-x="15" data-y="18" aria-label="haut gauche"></button>'.repeat(1)}<button class="zone" data-x="50" data-y="18" aria-label="haut centre"></button><button class="zone" data-x="85" data-y="18" aria-label="haut droit"></button><button class="zone" data-x="15" data-y="50" aria-label="milieu gauche"></button><button class="zone" data-x="50" data-y="50" aria-label="centre"></button><button class="zone" data-x="85" data-y="50" aria-label="milieu droit"></button><button class="zone" data-x="15" data-y="82" aria-label="bas gauche"></button><button class="zone" data-x="50" data-y="82" aria-label="bas centre"></button><button class="zone" data-x="85" data-y="82" aria-label="bas droit"></button></div></div><div class="msg" id="msg"></div><button class="mainbtn hidden" id="next">Continuer →</button></div><div class="card hidden" id="end"><div class="final" id="final"></div><button class="mainbtn" id="again">Rejouer</button></div></main><script>
const qs=[['Quel pays a gagné la Coupe du monde 2018?',['France','Brésil','Allemagne','Croatie'],0],['Combien de joueurs dans une équipe sur le terrain?',['9','10','11','12'],2],['Quel club joue au Santiago-Bernabéu?',['Real Madrid','FC Barcelone','Juventus','Milan AC'],0],['Qui est surnommé La Pulga?',['Mbappé','Messi','Haaland','Benzema'],1],['Un match normal dure combien de minutes?',['60','75','90','120'],2]];let i=0,score=0,goals=0,locked=false;const $=x=>document.getElementById(x);function render(){locked=false;$('quiz').classList.remove('hidden');$('penalty').classList.add('hidden');$('end').classList.add('hidden');$('qn').textContent=i+1;$('prog').style.width=((i)/5*100)+'%';$('question').textContent=qs[i][0];$('answers').innerHTML='';qs[i][1].forEach((a,n)=>{let b=document.createElement('button');b.className='ans';b.textContent=a;b.onclick=()=>answer(n);$('answers').appendChild(b)});$('score').textContent=score}function answer(n){if(locked)return;locked=true;if(n!==qs[i][2]){score=Math.max(0,score-10);$('question').textContent='❌ Mauvaise réponse';$('answers').innerHTML='<div class="small">Bonne réponse : '+qs[i][1][qs[i][2]]+'</div>';setTimeout(()=>nextRound(),850);return}score+=20;$('quiz').classList.add('hidden');$('penalty').classList.remove('hidden');$('msg').textContent='';$('next').classList.add('hidden');$('keeper').style.left='50%';$('keeper').style.top='45%';$('ball').style.left='50%';$('ball').style.top='82%';$('score').textContent=score}document.querySelectorAll('.zone').forEach(z=>z.onclick=()=>shoot(z));function shoot(z){if(!locked||!$('next').classList.contains('hidden'))return;let x=+z.dataset.x,y=+z.dataset.y;let choices=[[15,18],[50,18],[85,18],[15,50],[50,50],[85,50],[15,82],[50,82],[85,82]],k=choices[Math.floor(Math.random()*choices.length)];$('ball').style.left=x+'%';$('ball').style.top=y+'%';$('keeper').style.left=k[0]+'%';$('keeper').style.top=k[1]+'%';let save=Math.abs(k[0]-x)<17&&Math.abs(k[1]-y)<22;if(save){$('msg').textContent='🧤 ARRÊT MONSTRE !';$('keeper').classList.add('keeper-save');$('field').classList.add('shake');}else{goals++;score+=100;$('msg').textContent='🥅 BUUUUT ! +100';$('ball').classList.add('goalfx')}$('score').textContent=score;$('next').classList.remove('hidden');setTimeout(()=>{$('keeper').classList.remove('keeper-save');$('field').classList.remove('shake');$('ball').classList.remove('goalfx')},600)}$('next').onclick=nextRound;function nextRound(){if(i===4){finish();return}i++;render()}function finish(){$('quiz').classList.add('hidden');$('penalty').classList.add('hidden');$('end').classList.remove('hidden');$('final').innerHTML='🏆 FIN DU MATCH<br><span style="font-size:18px">'+goals+'/5 buts • '+score+' points</span>'}$('again').onclick=()=>{i=0;score=0;goals=0;render()};render();
</script></body></html>
